<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>You're offline · Bambo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, Segoe UI, Arial, sans-serif; background: #F6F7F9; color: #0F172A; text-align: center; padding: 24px; box-sizing: border-box; }
  .b { width: 72px; height: 72px; border-radius: 20px; background: #185FA5; color: #fff; display: grid; place-items: center; font-size: 36px; font-weight: 800; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #475569; line-height: 1.6; margin: 0 0 20px; max-width: 360px; }
  button { border: 0; background: #185FA5; color: #fff; font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="b">B</div>
    <h1>You're offline</h1>
    <p>Bambo needs an internet connection to load questions and save your answers. Any test in progress is saved, and you can finish it once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
